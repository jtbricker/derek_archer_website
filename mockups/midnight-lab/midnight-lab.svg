  <text x="80" y="38" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Derek B. Archer, PhD</text>
  <text x="700" y="38" fill="#14b8a6" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">Home</text>

  <circle cx="300" cy="500" r="150" fill="#8b5cf6" opacity="0.03"/>

  <!-- Hero text -->
  <text x="80" y="220" fill="#14b8a6" font-family="monospace" font-size="12" letter-spacing="3" text-transform="uppercase">NEUROIMAGING &amp; COMPUTATIONAL GENETICS</text>
  <text x="80" y="300" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800">Derek B. Archer</text>
  <text x="830" y="300" fill="url(#ml-teal-grad)" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800">, PhD</text>
  <text x="80" y="360" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="20">Investigating the neural and genetic architecture of aging and</text>
  <text x="80" y="388" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="20">neurodegeneration through advanced neuroimaging and computational genomics.</text>
  <text x="80" y="440" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="16">Assistant Professor of Neurology · </text>
  <text x="320" y="440" fill="#f59e0b" font-family="Source Sans 3, system-ui, sans-serif" font-size="16" font-weight="600">Vanderbilt University Medical Center</text>


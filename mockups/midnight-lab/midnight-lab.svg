    <line x1="240" y1="60" x2="240" y2="660"/><line x1="320" y1="60" x2="320" y2="660"/>
    <line x1="400" y1="60" x2="400" y2="660"/><line x1="480" y1="60" x2="480" y2="660"/>
    <line x1="560" y1="60" x2="560" y2="660"/><line x1="640" y1="60" x2="640" y2="660"/>

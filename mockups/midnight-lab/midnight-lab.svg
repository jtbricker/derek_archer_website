  <rect x="80" y="480" width="180" height="44" rx="8" fill="#14b8a6"/>
  <text x="120" y="508" fill="#0a1628" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Explore Research →</text>

  <text x="80" y="900" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="15">Bridging neuroimaging and genomics to understand brain aging and neurodegeneration at scale.</text>

  <!-- Card 1 -->
  <rect x="80" y="940" width="250" height="200" rx="12" fill="url(#ml-card-grad)" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
  <rect x="100" y="965" width="40" height="40" rx="8" fill="#14b8a6" opacity="0.15"/>
  <text x="112" y="994" fill="#14b8a6" font-size="20">🧠</text>

  <text x="380" y="1040" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Computational</text>
  <text x="380" y="1058" fill="#f1f5f9" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600">Genetics</text>
  <text x="380" y="1085" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="12">GWAS and polygenic risk</text>
  <text x="380" y="1102" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="12">scores mapping genetic</text>
  <text x="380" y="1119" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="12">susceptibility to brain changes.</text>


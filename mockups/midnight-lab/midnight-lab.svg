  <text x="200" y="700" fill="#14b8a6" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" text-anchor="middle" filter="url(#ml-glow-sm)">2,060+</text>
  <text x="200" y="730" fill="#94a3b8" font-family="Source Sans 3, system-ui, sans-serif" font-size="13" text-anchor="middle">Citations</text>

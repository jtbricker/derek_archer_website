<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" font-family="Arial, sans-serif">
  <!-- This SVG shows all 5 chapters stacked vertically to illustrate the scroll narrative -->

  <!-- ==================== CHAPTER 0: THE OPENING ==================== -->
  <rect x="0" y="0" width="1200" height="320" fill="#0c0a3e"/>
  <!-- Subtle particle dots -->
  <circle cx="200" cy="80" r="2" fill="#7c3aed" opacity="0.3"/>
  <circle cx="350" cy="130" r="1.5" fill="#7c3aed" opacity="0.2"/>
  <circle cx="800" cy="60" r="2.5" fill="#7c3aed" opacity="0.25"/>
  <circle cx="950" cy="150" r="1.5" fill="#7c3aed" opacity="0.15"/>
  <circle cx="1050" cy="90" r="2" fill="#7c3aed" opacity="0.2"/>
  <circle cx="150" cy="200" r="1.5" fill="#7c3aed" opacity="0.2"/>
  <circle cx="700" cy="250" r="2" fill="#7c3aed" opacity="0.15"/>
  <circle cx="1100" cy="220" r="1.5" fill="#7c3aed" opacity="0.25"/>

  <!-- Name - centered, massive -->
  <text x="600" y="130" text-anchor="middle" fill="#e2e8f0" font-size="60" font-weight="700" letter-spacing="-2">Derek B. Archer</text>
  <text x="600" y="170" text-anchor="middle" fill="#94a3b8" font-size="18" font-style="italic">Mapping the neuroscience of aging — from genes to brain to behavior.</text>

  <!-- Scroll indicator -->
  <line x1="600" y1="250" x2="600" y2="290" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <text x="600" y="310" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace" letter-spacing="2">SCROLL TO EXPLORE</text>

  <!-- Chapter dots (fixed indicator - shown on left) -->
  <circle cx="30" cy="50" r="6" fill="#7c3aed"/>
  <text x="45" y="54" fill="#7c3aed" font-size="10" font-family="monospace">00</text>
  <circle cx="30" cy="80" r="3" fill="#94a3b8" opacity="0.3"/>
  <circle cx="30" cy="100" r="3" fill="#94a3b8" opacity="0.3"/>
  <circle cx="30" cy="120" r="3" fill="#94a3b8" opacity="0.3"/>
  <circle cx="30" cy="140" r="3" fill="#94a3b8" opacity="0.3"/>
  <line x1="30" y1="56" x2="30" y2="74" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>
  <line x1="30" y1="86" x2="30" y2="94" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>
  <line x1="30" y1="106" x2="30" y2="114" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>
  <line x1="30" y1="126" x2="30" y2="134" stroke="#94a3b8" stroke-width="1" opacity="0.2"/>

  <!-- Chapter transition gradient -->
  <defs>
    <linearGradient id="ch0-ch1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a3e"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="ch1-ch2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="ch2-ch3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2818"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="ch3-ch4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- ==================== CHAPTER 1: THE RESEARCHER ==================== -->
  <rect x="0" y="320" width="1200" height="300" fill="url(#ch0-ch1)"/>

  <!-- Chapter number -->
  <text x="100" y="370" fill="#7c3aed" font-size="14" font-family="monospace" letter-spacing="2">01</text>
  <text x="100" y="405" fill="#e2e8f0" font-size="36" font-weight="700">The Researcher</text>

  <!-- Split layout: sticky text left, visual right -->
  <!-- Left panel -->
  <rect x="80" y="430" width="440" height="170" rx="0" fill="none"/>
  <text x="100" y="455" fill="#e2e8f0" font-size="13">
    <tspan x="100" dy="0">Derek B. Archer is an Assistant Professor of</tspan>
    <tspan x="100" dy="20">Neurology at Vanderbilt University Medical Center,</tspan>
    <tspan x="100" dy="20">where he leads research at the intersection of</tspan>
    <tspan x="100" dy="20">neuroimaging, computational genetics, and</tspan>
    <tspan x="100" dy="20">neurodegenerative disease.</tspan>
  </text>
  <!-- Mini timeline -->
  <line x1="100" y1="570" x2="420" y2="570" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
  <circle cx="130" cy="570" r="4" fill="#7c3aed"/>
  <text x="130" y="590" text-anchor="middle" fill="#94a3b8" font-size="9">PhD</text>
  <circle cx="230" cy="570" r="4" fill="#7c3aed"/>
  <text x="230" y="590" text-anchor="middle" fill="#94a3b8" font-size="9">Postdoc</text>
  <circle cx="330" cy="570" r="4" fill="#7c3aed"/>
  <text x="330" y="590" text-anchor="middle" fill="#94a3b8" font-size="9">Asst. Prof</text>
  <circle cx="400" cy="570" r="4" fill="#7c3aed" opacity="0.5"/>

  <!-- Right panel - visual area -->
  <rect x="580" y="350" width="540" height="250" rx="12" fill="#1a0a3e" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.2"/>
  <text x="850" y="480" text-anchor="middle" fill="#94a3b8" font-size="14">[Stylized portrait / campus visual]</text>
  <text x="850" y="505" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Scrolls through visual transitions</text>
  <!-- Sticky indicator -->
  <rect x="100" y="432" width="4" height="120" rx="2" fill="#7c3aed" opacity="0.3"/>
  <text x="115" y="365" fill="#94a3b8" font-size="9" font-style="italic">← sticky text</text>
  <text x="850" y="360" text-anchor="middle" fill="#94a3b8" font-size="9" font-style="italic">scrolling visual →</text>

  <!-- ==================== CHAPTER 2: THE SCIENCE ==================== -->
  <rect x="0" y="620" width="1200" height="340" fill="url(#ch1-ch2)"/>

  <!-- Chapter number -->
  <text x="100" y="665" fill="#10b981" font-size="14" font-family="monospace" letter-spacing="2">02</text>
  <text x="100" y="700" fill="#e2e8f0" font-size="36" font-weight="700">The Science</text>

  <!-- Horizontal scrolling cards (shown staggered to suggest scroll) -->
  <!-- Card 1 (active, fully visible) -->
  <rect x="100" y="720" width="380" height="210" rx="12" fill="#0a2818" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="100" y="720" width="380" height="4" rx="2" fill="#10b981"/>
  <text x="130" y="760" fill="#e2e8f0" font-size="18" font-weight="700">Neuroimaging Biomarkers</text>
  <text x="130" y="785" fill="#94a3b8" font-size="12">
    <tspan x="130" dy="0">Advanced MRI techniques and machine</tspan>
    <tspan x="130" dy="18">learning to identify structural and functional</tspan>
    <tspan x="130" dy="18">brain signatures of neurodegeneration.</tspan>
  </text>
  <!-- Methodology badges -->
  <rect x="130" y="850" width="60" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="160" y="865" text-anchor="middle" fill="#10b981" font-size="9">fMRI</text>
  <rect x="200" y="850" width="50" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="225" y="865" text-anchor="middle" fill="#10b981" font-size="9">DTI</text>
  <rect x="260" y="850" width="40" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
  <text x="280" y="865" text-anchor="middle" fill="#10b981" font-size="9">ML</text>

  <!-- Card 2 (partially visible, sliding in) -->
  <rect x="510" y="730" width="380" height="210" rx="12" fill="#0a2818" stroke="#10b981" stroke-width="1" stroke-opacity="0.15"/>
  <rect x="510" y="730" width="380" height="4" rx="2" fill="#10b981" opacity="0.5"/>
  <text x="540" y="770" fill="#e2e8f0" font-size="18" font-weight="700" opacity="0.7">Computational Genetics</text>
  <text x="540" y="795" fill="#94a3b8" font-size="12" opacity="0.5">
    <tspan x="540" dy="0">Genome-wide association studies</tspan>
    <tspan x="540" dy="18">and polygenic risk scores...</tspan>
  </text>

  <!-- Card 3 (barely visible edge) -->
  <rect x="920" y="740" width="380" height="210" rx="12" fill="#0a2818" stroke="#10b981" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Large metric between cards (scroll-triggered) -->
  <text x="850" y="700" text-anchor="middle" fill="#10b981" font-size="48" font-weight="700" opacity="0.2">2,060+</text>
  <text x="850" y="720" text-anchor="middle" fill="#94a3b8" font-size="11" opacity="0.2">CITATIONS</text>

  <!-- ==================== CHAPTER 3: THE WORK ==================== -->
  <rect x="0" y="960" width="1200" height="340" fill="url(#ch2-ch3)"/>

  <!-- Chapter number -->
  <text x="100" y="1005" fill="#f43f5e" font-size="14" font-family="monospace" letter-spacing="2">03</text>
  <text x="100" y="1040" fill="#e2e8f0" font-size="36" font-weight="700">The Work</text>

  <!-- Timeline visualization -->
  <!-- Central vertical line -->
  <line x1="600" y1="1060" x2="600" y2="1280" stroke="#f43f5e" stroke-width="2" opacity="0.3"/>

  <!-- Paper on left side -->
  <rect x="200" y="1070" width="370" height="70" rx="8" fill="#1a0a0a" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
  <text x="560" y="1100" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="600">White matter hyperintensities and AD risk</text>
  <text x="560" y="1118" text-anchor="end" fill="#f43f5e" font-size="10">JAMA Neurology</text>
  <text x="560" y="1133" text-anchor="end" fill="#94a3b8" font-size="10">2025 · Last Author</text>
  <!-- Connection dot -->
  <circle cx="600" cy="1095" r="6" fill="#f43f5e"/>
  <!-- Year label -->
  <text x="620" y="1100" fill="#f43f5e" font-size="16" font-weight="700" font-family="monospace">2025</text>

  <!-- Paper on right side -->
  <rect x="630" y="1150" width="370" height="70" rx="8" fill="#1a0a0a" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.2"/>
  <text x="640" y="1180" fill="#e2e8f0" font-size="12" font-weight="600">Brain-predicted age and cognition</text>
  <text x="640" y="1198" fill="#f43f5e" font-size="10">Neurobiology of Aging</text>
  <text x="640" y="1213" fill="#94a3b8" font-size="10">2024 · First Author</text>
  <!-- Connection dot -->
  <circle cx="600" cy="1180" r="6" fill="#f43f5e" opacity="0.7"/>
  <text x="575" y="1185" text-anchor="end" fill="#f43f5e" font-size="16" font-weight="700" font-family="monospace">2024</text>

  <!-- Paper on left side (fading) -->
  <rect x="200" y="1235" width="370" height="55" rx="8" fill="#1a0a0a" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.15"/>
  <text x="560" y="1260" text-anchor="end" fill="#e2e8f0" font-size="12" font-weight="600" opacity="0.6">Brain age gap and genetic influences...</text>
  <text x="560" y="1278" text-anchor="end" fill="#f43f5e" font-size="10" opacity="0.5">Nature Communications</text>
  <circle cx="600" cy="1260" r="5" fill="#f43f5e" opacity="0.4"/>

  <!-- Timeline drawing indicator -->
  <text x="600" y="1300" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">↓ timeline draws as you scroll ↓</text>

  <!-- ==================== CHAPTER 4: THE NETWORK ==================== -->
  <rect x="0" y="1300" width="1200" height="300" fill="url(#ch3-ch4)"/>

  <!-- Chapter number -->
  <text x="100" y="1345" fill="#3b82f6" font-size="14" font-family="monospace" letter-spacing="2">04</text>
  <text x="100" y="1380" fill="#e2e8f0" font-size="36" font-weight="700">The Network</text>

  <!-- Full-screen collaboration graph preview -->
  <!-- Central node -->
  <circle cx="600" cy="1480" r="24" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="1485" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">DBA</text>

  <!-- VMAP node -->
  <line x1="600" y1="1480" x2="440" y2="1420" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  <circle cx="440" cy="1420" r="18" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="1424" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">VMAP</text>

  <!-- VADRC node -->
  <line x1="600" y1="1480" x2="760" y2="1420" stroke="#10b981" stroke-width="1" opacity="0.4"/>
  <circle cx="760" cy="1420" r="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="760" y="1424" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">VADRC</text>

  <!-- CNT node -->
  <line x1="600" y1="1480" x2="460" y2="1540" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
  <circle cx="460" cy="1540" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="1544" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">CNT</text>

  <!-- VALIANT node -->
  <line x1="600" y1="1480" x2="740" y2="1540" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
  <circle cx="740" cy="1540" r="18" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="740" y="1544" text-anchor="middle" fill="#e2e8f0" font-size="9" font-weight="600">VALIANT</text>

  <!-- Glow effects -->
  <circle cx="600" cy="1480" r="40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>
  <circle cx="600" cy="1480" r="60" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.05"/>

  <text x="600" y="1580" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Interactive force-directed graph · drag and hover to explore</text>

  <!-- Design labels -->
  <text x="600" y="25" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="3">STORY SCROLL — CHAPTERS WIREFRAME (SCROLLING VIEW)</text>

  <!-- Chapter flow arrows -->
  <text x="1160" y="320" text-anchor="middle" fill="#94a3b8" font-size="16" opacity="0.3">↓</text>
  <text x="1160" y="620" text-anchor="middle" fill="#94a3b8" font-size="16" opacity="0.3">↓</text>
  <text x="1160" y="960" text-anchor="middle" fill="#94a3b8" font-size="16" opacity="0.3">↓</text>
  <text x="1160" y="1300" text-anchor="middle" fill="#94a3b8" font-size="16" opacity="0.3">↓</text>
</svg>

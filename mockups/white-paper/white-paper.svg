  <text x="80" y="1478" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12">Archer DB, Bricker JT, ... Vaillancourt DE</text>
  <text x="370" y="1478" fill="#1e40af" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">The Lancet Digital Health, 2019</text>

  <rect x="500" y="1510" width="200" height="40" rx="6" fill="none" stroke="#1e40af" stroke-width="1.5"/>

  <text x="120" y="818" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Neuroimaging Biomarkers</text>
  <text x="120" y="842" fill="#64748b" font-family="Georgia, serif" font-size="13">Identifying in-vivo structural brain changes in neurodegeneration</text>
  <text x="120" y="862" fill="#64748b" font-family="Georgia, serif" font-size="13">using diffusion MRI and advanced imaging techniques.</text>

  <rect x="630" y="775" width="520" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="650" y="795" width="4" height="50" rx="2" fill="#7c3aed"/>
  <text x="670" y="818" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">Computational Genetics</text>
  <text x="670" y="842" fill="#64748b" font-family="Georgia, serif" font-size="13">GWAS and polygenic risk scores mapping genetic susceptibility</text>
  <text x="670" y="862" fill="#64748b" font-family="Georgia, serif" font-size="13">to brain structural changes in aging and Alzheimer's disease.</text>

  <rect x="80" y="925" width="520" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="100" y="945" width="4" height="50" rx="2" fill="#059669"/>
  <text x="120" y="968" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">White Matter Neurodegeneration</text>
  <text x="120" y="992" fill="#64748b" font-family="Georgia, serif" font-size="13">Multi-site MRI harmonization for large-scale studies of white</text>
  <text x="120" y="1012" fill="#64748b" font-family="Georgia, serif" font-size="13">matter decline in aging, with 2,600+ participants across 7 cohorts.</text>

  <rect x="630" y="925" width="520" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="650" y="945" width="4" height="50" rx="2" fill="#d97706"/>
  <text x="670" y="968" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600">AI-Driven Brain Signatures</text>
  <text x="670" y="992" fill="#64748b" font-family="Georgia, serif" font-size="13">Deep learning on imaging and genetics data to build predictive</text>
  <text x="670" y="1012" fill="#64748b" font-family="Georgia, serif" font-size="13">brain age models and disease signatures.</text>


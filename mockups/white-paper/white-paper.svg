  <text x="80" y="320" fill="#334155" font-family="Georgia, serif" font-size="17" font-style="italic">Investigating the neural and genetic architecture</text>
  <text x="80" y="348" fill="#334155" font-family="Georgia, serif" font-size="17" font-style="italic">of aging and neurodegeneration through advanced</text>
  <text x="80" y="376" fill="#334155" font-family="Georgia, serif" font-size="17" font-style="italic">neuroimaging, diffusion MRI, and computational genomics.</text>

